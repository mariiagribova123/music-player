<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="Личный аудиоплеер, который сортирует музыку по настроению">
  <title>forma — твоя музыка по настроению</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="experience.css">
  <link rel="stylesheet" href="palette.css">
</head>
<body>
  <div class="app">
    <header>
      <button class="brand" aria-label="Моя музыка" data-tab="live">
        <svg viewBox="0 0 40 40"><path d="M13 6 Q8 3 8 10 V30 Q8 37 14 33 L32 23 Q38 20 32 17Z"/></svg>
        <span class="brand-name">forma</span><span>player</span>
      </button>
      <span class="onair"><i></i> МОЯ ВОЛНА</span>
    </header>
    <main id="main"></main>
    <div class="bottom">
      <section class="player" aria-label="Аудиоплеер">
        <div class="mini-art">f.</div>
        <div class="now"><strong id="track">Добавь музыку или выбери настроение</strong><span id="artist">Forma разложит треки по карточкам</span></div>
        <button id="favorite" class="icon" aria-label="Добавить настроение в избранное">♡</button>
        <button id="play" class="play" aria-label="Воспроизвести">▶</button>
        <button id="next" class="icon" aria-label="Следующий трек">⏭</button>
        <div class="sound-controls">
        <div class="volume-control" role="group" aria-label="Громкость">
          <button id="mute" class="icon" aria-label="Выключить звук" aria-pressed="false"></button>
          <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="Громкость">
          <output id="volume-value" for="volume">100%</output>
        </div>
        <div class="equalizer" role="group" aria-label="Эквалайзер">
          <label>Басы <output id="eq-bass-value" for="eq-bass">0</output><input id="eq-bass" type="range" min="-12" max="12" value="0" step="1" aria-label="Басы"></label>
          <label>Середина <output id="eq-mid-value" for="eq-mid">0</output><input id="eq-mid" type="range" min="-12" max="12" value="0" step="1" aria-label="Средние частоты"></label>
          <label>Высокие <output id="eq-high-value" for="eq-high">0</output><input id="eq-high" type="range" min="-12" max="12" value="0" step="1" aria-label="Высокие частоты"></label>
          <button id="eq-reset" aria-label="Сбросить эквалайзер" title="Сбросить эквалайзер">↺</button>
        </div>
        </div>
        <div class="progress"><div id="progress"></div></div>
      </section>
      <nav aria-label="Основная навигация">
        <button data-tab="live" class="active"><svg viewBox="0 0 24 24"><path d="M4 10v4m4-8v12m4-15v18m4-15v12m4-8v4"/></svg>Моя музыка</button>
        <button data-tab="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>Поиск</button>
        <button data-tab="favorites"><svg viewBox="0 0 24 24"><path d="M12 21 3 12C-3 3 8-1 12 6 16-1 27 3 21 12Z"/></svg>Избранное</button>
      </nav>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
  </div>
  <input id="music-picker" class="visually-hidden" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac" multiple>
  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  <script src="mood-analysis.js"></script>
  <script src="app.js"></script>
  <script src="experience.js"></script>
  <script>sortBundledMusic();</script>
</body>
</html>
